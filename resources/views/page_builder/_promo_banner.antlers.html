{{#
    @name Promo banner
    @desc A full-width promotional banner with centered text.
    @set page.page_builder.promo_banner
#}}

<div
    class="span-full relative isolate overflow-hidden px-6 py-16 text-center md:px-12 md:py-24 {{ if background_image }}bg-cover bg-center{{ /if }}"
    style="background-color: {{ background_color or '#C9232C' }};{{ if background_image }} background-image: url('{{ background_image:url }}');{{ /if }}"
>
    {{ if background_overlay !== 'none' }}
        <div
            class="absolute inset-0 -z-10 bg-black"
            style="opacity: {{ background_overlay or '40' }}%"
            aria-hidden="true"
        ></div>
    {{ /if }}

    <div class="relative mx-auto max-w-3xl {{ if text_color === 'black' }}text-black{{ else }}text-white{{ /if }}">
        <h2 class="text-3xl font-bold leading-tight md:text-5xl">{{ heading }}</h2>
        {{ if text }}
            <p class="mx-auto mt-5 max-w-2xl text-lg leading-relaxed md:text-xl">{{ text }}</p>
        {{ /if }}
    </div>
</div>
