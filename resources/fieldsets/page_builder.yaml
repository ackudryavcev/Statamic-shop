title: 'Page builder'
fields:
  -
    handle: page_builder
    field:
      type: replicator
      localizable: true
      hide_display: true
      collapse: true
      listable: false
      display: 'Page builder'
      button_label: 'Add block'
      sets:
        promotional:
          display: Promotional
          instructions: 'Promotional content blocks.'
          icon: megaphone
          sets:
            promo_banner:
              display: 'Promo banner'
              instructions: 'A full-width banner with centered text and an image or color background.'
              icon: megaphone
              fields:
                -
                  handle: heading
                  field:
                    type: text
                    localizable: true
                    validate: required
                    display: Heading
                -
                  handle: text
                  field: common.text_plain
                  config:
                    display: Text
                -
                  handle: background_image
                  field: common.image
                  config:
                    display: 'Background image'
                -
                  handle: background_color
                  field:
                    type: color
                    localizable: true
                    default: '#C9232C'
                    display: 'Background color'
                    instructions: 'Used when no background image is selected.'
                -
                  handle: text_color
                  field:
                    type: select
                    localizable: true
                    default: white
                    display: 'Text color'
                    options:
                      white: White
                      black: Black
                -
                  import: background_overlay
        image_and_text:
          display: 'Image and text'
          instructions: 'Image and text based blocks.'
          icon: hero-image-above-text
          sets:
            article:
              display: Article
              instructions: 'Long form content, can be expanded with media like figures, video, quotes or tables.'
              icon: text-formatting-image-bottom
              image: article.jpeg
              fields:
                -
                  import: article
        interactive:
          display: Interactive
          instructions: 'Interactive blocks.'
          icon: programming-script-code
          sets:
            form:
              display: Form
              instructions: 'Select and render a form.'
              icon: mail-chat-bubble-text
              image: form.jpeg
              fields:
                -
                  import: form
            cards:
              display: Cards
              instructions: 'Show linkable cards with text.'
              icon: link
              image: cards.jpeg
              fields:
                -
                  import: cards
            faq:
              display: FAQ
              icon: text-formatting-initial-letter
              fields:
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                    default: Frequently asked questions
            products:
              display: 'Product grid'
              instructions: 'Display all published products from the Products collection.'
              icon: shopping-bag
              fields:
                -
                  import: product_grid
